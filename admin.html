:root{--ink:#0d1524;--ink-2:#141f36;--ink-3:#1c2a48;--gold:#d6b066;--gold-hi:#ecd39a;--ivory:#f4eee0;--mute:#a9b2c4;--line:rgba(214,176,102,.26);--bad:#e88a8a;--ok:#8fd3a8;--r:6px;--font:"Vazirmatn",system-ui,Tahoma,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:var(--ivory);font-family:var(--font);line-height:1.7;min-height:100vh}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(14px,3vw,32px);border-bottom:1px solid var(--line);background:var(--ink-2);position:sticky;top:0;z-index:20}
.top h1{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px}.top h1 img{height:30px}
.top nav{display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px clamp(14px,3vw,32px) 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{padding:9px 16px;white-space:nowrap;color:var(--mute);border-bottom:2px solid transparent;font-weight:600}
.tabs button.on{color:var(--gold-hi);border-color:var(--gold)}
main{max-width:980px;margin:0 auto;padding:clamp(16px,3vw,32px)}
h2{font-size:22px;font-weight:800;margin-bottom:6px}
.sub{color:var(--mute);margin-bottom:20px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 18px;border-radius:var(--r);font-weight:700;font-size:14px;border:1px solid var(--line);transition:.2s}
.btn:hover{border-color:var(--gold);color:var(--gold-hi)}
.btn.gold{background:var(--gold);color:var(--ink);border-color:var(--gold)}.btn.gold:hover{background:var(--gold-hi);color:var(--ink)}
.btn.bad{color:var(--bad)}.btn.bad:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 12px;font-size:13px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,26px)}
.row{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid rgba(214,176,102,.14);border-radius:var(--r);background:var(--ink-2);margin-bottom:10px}
.row img{width:76px;height:56px;object-fit:cover;border-radius:4px;background:var(--ink-3);flex:none}
.row .grow{flex:1;min-width:0}.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mute)}.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-block;font-size:12px;padding:0 10px;border-radius:99px;border:1px solid var(--line);color:var(--gold-hi);margin-inline-start:6px}
.pill.off{color:var(--mute);border-color:rgba(169,178,196,.3)}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:var(--r);color:var(--ivory);font:inherit;padding:9px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
textarea{min-height:110px;resize:vertical}
.f{margin-bottom:14px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}.row{flex-wrap:wrap}.row .acts{width:100%;justify-content:flex-start}}
.hint{font-size:13px;color:var(--gold-hi);margin-top:4px;min-height:1.4em}
.chk{display:flex;align-items:center;gap:8px;color:var(--ivory);font-size:15px;margin:0}.chk input{width:auto}
.rep{border:1px solid rgba(214,176,102,.18);border-radius:var(--r);padding:12px;margin-bottom:10px;background:var(--ink)}
.rep .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--mute);font-size:13px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:10px}
.im{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--ink)}
.im img{width:100%;aspect-ratio:4/3;object-fit:cover}
.im .t{position:absolute;top:4px;right:4px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;padding:0 8px;border-radius:99px}
.im .ctl{display:flex;justify-content:space-between;padding:2px 4px}.im .ctl button{padding:0 8px;font-size:16px}
.im .ctl button:hover{color:var(--gold-hi)}
dialog{border:0;background:transparent;color:var(--ivory);margin:auto;max-width:100vw;padding:0}
dialog::backdrop{background:rgba(6,10,18,.85)}
.sheet{width:min(760px,calc(100vw - 20px));max-height:calc(100dvh - 20px);overflow:auto;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:clamp(16px,3vw,28px)}
.login{max-width:400px;margin:12vh auto 0;padding:0 16px}
.login img{width:110px;margin:0 auto 20px;display:block}
.notice{border:1px solid var(--gold);border-radius:var(--r);padding:16px 18px;background:rgba(214,176,102,.08);margin-bottom:18px}
.notice ol{padding-inline-start:20px;margin-top:8px;color:#d7d0bf}
.err{color:var(--bad);font-size:14px;min-height:1.4em;margin:8px 0}
.toast{position:fixed;z-index:200;bottom:24px;left:50%;transform:translate(-50%,30px);background:var(--gold);color:var(--ink);padding:10px 22px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:var(--bad)}
.opts{display:grid;gap:8px}.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.opt input{width:auto;margin-top:6px}.opt small{display:block;color:var(--mute)}

</style>
</head>

<div id="app"></div>
<dialog id="dlg"><div class="sheet" id="dlgBox"></div></dialog>
<div class="toast" id="toast"></div>

<script src="config.js"></script>

  /* ---------- category photos ---------- */
  const CAT_IMG = { "باغ": "cat-garden.jpg", "ویلا": "cat-villa.jpg", "خانه": "cat-house.jpg", "اجاره": "cat-rent.jpg", "رهن": "cat-mortgage.jpg", "خرید": "cat-buy.jpg" };
  const CAR_SVG = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2a48"/><stop offset="1" stop-color="#0d1524"/></linearGradient></defs><rect width="500" height="500" fill="url(#g)"/><g fill="none" stroke="#d6b066" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-30)"><path d="M70 290 L70 250 Q70 235 88 230 L150 215 L200 170 Q210 160 225 160 L320 160 Q335 160 345 170 L385 215 L410 225 Q425 230 425 248 L425 290"/><path d="M205 215 L235 175 L305 175 L340 215 Z"/><path d="M70 290 H112 M188 290 H307 M383 290 H425"/><circle cx="150" cy="290" r="38"/><circle cx="345" cy="290" r="38"/><circle cx="150" cy="290" r="14"/><circle cx="345" cy="290" r="14"/><path d="M60 345 H440" stroke-width="2" opacity=".5"/></g></svg>');

  /* ---------- formatting ---------- */
  const fa = new Intl.NumberFormat("fa-IR");
  function toFaDigits(s) { return String(s).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]); }
  function toEnDigits(s) { return String(s).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)); }

  // Toman → readable Persian: "۱۸ میلیارد و ۵۰۰ میلیون تومان"
  function formatToman(n) {
    n = Number(n);
    if (!n || n <= 0) return "";
    const parts = [];
    const b = Math.floor(n / 1e9), m = Math.floor((n % 1e9) / 1e6), t = Math.floor((n % 1e6) / 1e3);
    if (b) parts.push(fa.format(b) + " میلیارد");
    if (m) parts.push(fa.format(m) + " میلیون");
    if (!b && !m && t) parts.push(fa.format(t) + " هزار");
    if (!parts.length) return fa.format(n) + " تومان";
    return parts.join(" و ") + " تومان";
  }
  function priceLines(l) {
    if (l.price_text) return [l.price_text];
    const out = [];
    if (l.price && l.rent) { out.push("رهن: " + formatToman(l.price)); out.push("اجاره: " + formatToman(l.rent) + " / ماه"); }
    else if (l.price) out.push(formatToman(l.price));
    else if (l.rent) out.push("اجاره: " + formatToman(l.rent) + " / ماه");
    else out.push("تماس بگیرید");
    return out;
  }
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ---------- deal link builders ---------- */
  function cleanPhone(p) { return toEnDigits(p || "").replace(/[^\d+]/g, ""); }
  function intlDigits(p) { // 0912… → 98912…
    let d = cleanPhone(p).replace(/^\+/, "");
    if (d.startsWith("00")) d = d.slice(2);
    if (d.startsWith("0")) d = "98" + d.slice(1);
    return d;
  }
  function handle(v) {
    return String(v || "").trim().replace(/^https?:\/\/(www\.)?(t\.me|telegram\.me|rubika\.ir|eitaa\.com|instagram\.com)\//i, "").replace(/^@/, "").replace(/\/+$/, "");
  }
  function fillTemplate(tpl, l) {
    return String(tpl || "").replace(/\{title\}/g, l.title || "").replace(/\{code\}/g, toFaDigits(l.code || ""))
      .replace(/\{price\}/g, priceLines(l).join("، ")).replace(/\{location\}/g, l.location || "");
  }
  function callHref(contact, deal) {
    const ph = (contact.phones || [])[deal.call_phone_index || 0] || (contact.phones || [])[0];
    return ph && ph.number ? "tel:" + cleanPhone(ph.number) : "";
  }
  // returns { href, copy } — copy = text to copy first (for apps without prefill support)
  function chatTarget(contact, deal, l) {
    const msg = fillTemplate(deal.message_template, l);
    const enc = encodeURIComponent(msg);
    switch (deal.chat_channel) {
      case "telegram": return contact.telegram ? { href: `https://t.me/${handle(contact.telegram)}?text=${enc}` } : null;
      case "whatsapp": return contact.whatsapp ? { href: `https://wa.me/${intlDigits(contact.whatsapp)}?text=${enc}` } : null;
      case "rubika": return contact.rubika ? { href: `https://rubika.ir/${handle(contact.rubika)}`, copy: msg } : null;
      case "eitaa": return contact.eitaa ? { href: `https://eitaa.com/${handle(contact.eitaa)}`, copy: msg } : null;
      case "sms": {
        const ph = (contact.phones || [])[deal.call_phone_index || 0];
        return ph ? { href: `sms:${cleanPhone(ph.number)}?body=${enc}` } : null;
      }
      case "custom": return deal.custom_url ? { href: deal.custom_url.replace(/\{text\}/g, enc).replace(/\{title\}/g, encodeURIComponent(l.title || "")) , copy: msg } : null;
    }
    return null;
  }
  const CHANNELS = { telegram: "تلگرام", whatsapp: "واتساپ", rubika: "روبیکا", eitaa: "ایتا", sms: "پیامک", custom: "لینک دلخواه" };

  /* ---------- data access ---------- */
  async function loadSettings() {
    const s = JSON.parse(JSON.stringify(DEFAULTS));
    if (!sb) return s;
    const { data } = await sb.from("settings").select("key,value");
    (data || []).forEach(r => { s[r.key] = Object.assign({}, s[r.key], r.value); if (r.key === "hero" && r.value && r.value.chapters) s.hero.chapters = r.value.chapters; });
    return s;
  }
  async function loadCategories(all) {
    if (!sb) return DEMO.categories;
    let q = sb.from("categories").select("*").order("sort");
    if (!all) q = q.eq("active", true);
    const { data } = await q; return data || [];
  }
  async function loadListings(all) {
    if (!sb) return DEMO.listings;
    let q = sb.from("listings").select("*").order("featured", { ascending: false }).order("sort").order("created_at", { ascending: false });
    if (!all) q = q.eq("active", true);
    const { data } = await q; return data || [];
  }

  window.ME = { C, configured, sb, DEFAULTS, DEMO, catImage, esc, fa, formatToman, priceLines, toFaDigits, toEnDigits,
    cleanPhone, callHref, chatTarget, fillTemplate, CHANNELS, loadSettings, loadCategories, loadListings };
})();

<script>
(function () {

  async function boot() {

  function renderSetup() {

  function pathFromUrl(u) { const m = String(u).match(new RegExp("/object/public/" + C.BUCKET + "/(.+)$")); return m ? decodeURIComponent(m[1]) : null; }
  function removeFiles(urls) { const p = urls.map(pathFromUrl).filter(Boolean); if (p.length) sb.storage.from(C.BUCKET).remove(p); }

  function compress(file, max = 1600, q = .82) {
    return new Promise((res, rej) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(b => b ? res(b) : rej(new Error("compress")), "image/jpeg", q);
      };
      img.onerror = () => rej(new Error("bad image")); img.src = url;
    });
  }
  async function uploadImage(file, folder) {
    const blob = await compress(file);
    const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const { error } = await sb.storage.from(C.BUCKET).upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000" });
    if (error) throw error;
    return sb.storage.from(C.BUCKET).getPublicUrl(path).data.publicUrl;
  }

      <div class="f"><label>عکس‌ها (اولی عکس شاخص است)</label><div class="imgs" id="imgs"></div>
        <label class="btn sm" style="cursor:pointer">+ افزودن عکس<input id="fF" type="file" accept="image/*" multiple hidden></label> <span class="hint" id="up"></span></div>
      <div class="g2"><label class="chk"><input type="checkbox" id="fAc" ${l.active ? "checked" : ""}>نمایش در سایت</label><label class="chk"><input type="checkbox" id="fFe" ${l.featured ? "checked" : ""}>ملک ویژه (اول لیست)</label></div>
      <div class="bar" style="margin:22px 0 0"><button class="btn" id="cancel">انصراف</button><button class="btn gold" id="save">ذخیره</button></div>`;
    const drawImgs = () => {
      $("#imgs").innerHTML = imgs.map((u, i) => `<div class="im"><img src="${esc(u)}" alt="">${i === 0 ? `<span class="t">شاخص</span>` : ""}<div class="ctl"><button data-m="${i}" data-d="1" title="جلوتر">→</button><button data-x="${i}" title="حذف">✕</button><button data-m="${i}" data-d="-1" title="عقب‌تر">←</button></div></div>`).join("");
    };
    drawImgs();
    $("#imgs").onclick = e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.x !== undefined) { removed.push(imgs.splice(+b.dataset.x, 1)[0]); }
      if (b.dataset.m !== undefined) { const i = +b.dataset.m, j = i - +b.dataset.d; if (j >= 0 && j < imgs.length) [imgs[i], imgs[j]] = [imgs[j], imgs[i]]; }
      drawImgs();
    };
    const hint = () => { $("#hP").textContent = formatToman(num($("#fP").value)); $("#hR").textContent = formatToman(num($("#fR").value)); };
    $("#fP").oninput = $("#fR").oninput = hint; hint();
    $("#fF").onchange = async e => {
      const files = [...e.target.files]; let n = 0;
      for (const f of files) {
        $("#up").textContent = `در حال آپلود ${toFaDigits(++n)} از ${toFaDigits(files.length)}…`;
        try { imgs.push(await uploadImage(f, "listings")); drawImgs(); } catch (er) { toast("آپلود ناموفق: " + (er.message || er), true); }
      }
      $("#up").textContent = ""; e.target.value = "";
    };
    $("#cancel").onclick = () => { removeFiles(imgs.filter(u => !(l.images || []).includes(u))); dlg.close(); };
    $("#save").onclick = async () => {
      const title = $("#fT").value.trim(); if (!title) return toast("عنوان را وارد کنید", true);
      const row = { title, category_id: $("#fC").value || null, location: $("#fL").value.trim(), description: $("#fD").value.trim(),
        price: num($("#fP").value), rent: num($("#fR").value), price_text: $("#fPT").value.trim(), area_m2: num($("#fA").value), rooms: num($("#fRm").value),
        deal_mode: $("#fDM").value, images: imgs, active: $("#fAc").checked, featured: $("#fFe").checked };
      $("#save").disabled = true;
      const q = isNew ? sb.from("listings").insert(row) : sb.from("listings").update(row).eq("id", l.id);
      const { error } = await q;
      if (error) { $("#save").disabled = false; return toast("ذخیره نشد: " + error.message, true); }
      removeFiles(removed.filter(u => (l.images || []).includes(u)));
      dlg.close(); await loadAll(); renderApp(); toast("ذخیره شد");
    };
    dlg.showModal();
  }

  /* ---------------- categories ---------------- */
  function tabCats() {
    $("#main").innerHTML = `<div class="bar"><div><h2>دسته‌بندی‌ها</h2><p class="sub" style="margin:0">نام، عکس، ترتیب و نمایش هر دسته را تغییر دهید. عکس دسته در سایت روی کارت نمایش داده می‌شود.</p></div><button class="btn gold" id="add">+ دسته جدید</button></div>
      ${CATS.map(c => { const im = ME.catImage(c); return `<div class="row" data-id="${c.id}" data-img="${esc(c.image_url || "")}">
        <img class="cimg" src="${esc(im.src)}" alt="" style="width:64px;height:80px;background:var(--ink-3)">
        <div class="grow" style="display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:center"><input data-k="name" value="${esc(c.name)}" aria-label="نام"><input data-k="sort" value="${c.sort}" inputmode="numeric" aria-label="ترتیب" title="ترتیب"></div>
        <div class="acts"><label class="btn sm" style="cursor:pointer">عکس<input type="file" accept="image/*" hidden data-k="file"></label><label class="chk"><input type="checkbox" data-k="active" ${c.active ? "checked" : ""}>فعال</label>
        <button class="btn sm gold" data-a="save">ذخیره</button><button class="btn sm bad" data-a="del">حذف</button></div></div>`; }).join("")}`;
    $("#add").onclick = async () => {
      const { error } = await sb.from("categories").insert({ name: "دسته جدید", sort: (CATS.at(-1)?.sort || 0) + 1 });
      if (error) return toast(error.message, true); await loadAll(); renderApp();
    };
    $("#main").addEventListener("change", async e => {
      const f = e.target.closest("[data-k=file]"); if (!f || !f.files[0]) return;
      const r = f.closest(".row"); toast("در حال آپلود عکس…");
      try { r.dataset.img = await uploadImage(f.files[0], "categories"); r.querySelector(".cimg").src = r.dataset.img; toast("عکس آپلود شد؛ روی «ذخیره» بزنید"); }
      catch (er) { toast("آپلود ناموفق: " + (er.message || er), true); }
    });
    $("#main").onclick = async e => {
      const b = e.target.closest("[data-a]"); if (!b) return; const r = b.closest(".row"), id = r.dataset.id;
      if (b.dataset.a === "save") {
        const v = k => r.querySelector(`[data-k=${k}]`);
        const { error } = await sb.from("categories").update({ name: v("name").value.trim(), image_url: r.dataset.img || "", sort: num(v("sort").value) || 0, active: v("active").checked }).eq("id", id);
        if (error) return toast(/image_url/.test(error.message) ? "ابتدا دستور SQL ستون عکس را در Supabase اجرا کنید (README)" : error.message, true);
        await loadAll(); toast("ذخیره شد");
      } else if (confirm("این دسته حذف شود؟ ملک‌های آن بدون دسته می‌مانند.")) {
        const { error } = await sb.from("categories").delete().eq("id", id);
        if (error) return toast(error.message, true); await loadAll(); renderApp();
      }
    };
  }

  /* ---------------- settings helpers ---------------- */
  async function saveSetting(key, value) {
    const { error } = await sb.from("settings").upsert({ key, value });
    if (error) return toast("ذخیره نشد: " + error.message, true);
    S[key] = value; toast("ذخیره شد");
  }
  // repeater: items array edited in place
  function repeater(host, items, fields, opt = {}) {
    const draw = () => {
      host.innerHTML = items.map((it, i) => `<div class="rep"><div class="rh"><span>${esc(opt.label || "مورد")} ${toFaDigits(i + 1)}</span><span>
        ${opt.move ? `<button class="btn sm" data-r="up" data-i="${i}">↑</button> <button class="btn sm" data-r="dn" data-i="${i}">↓</button> ` : ""}<button class="btn sm bad" data-r="rm" data-i="${i}">حذف</button></span></div>
        <div class="${fields.length > 2 && !opt.stack ? "g3" : opt.stack ? "" : "g2"}">${fields.map(f => `<div class="f"><label>${f.label}</label>${f.area ? `<textarea data-i="${i}" data-k="${f.k}" style="min-height:70px">${esc(it[f.k] || "")}</textarea>` : `<input data-i="${i}" data-k="${f.k}" value="${esc(it[f.k] || "")}" ${f.ltr ? 'dir="ltr"' : ""} placeholder="${esc(f.ph || "")}">`}</div>`).join("")}</div></div>`).join("") +
        `<button class="btn sm" data-r="add">+ افزودن</button>`;
    };
    host.oninput = e => { const t = e.target; if (t.dataset.k) items[+t.dataset.i][t.dataset.k] = t.value; };
    host.onclick = e => {
      const b = e.target.closest("[data-r]"); if (!b) return; const i = +b.dataset.i, a = b.dataset.r;
      if (a === "add") items.push(Object.fromEntries(fields.map(f => [f.k, ""])));
      if (a === "rm") items.splice(i, 1);
      if (a === "up" && i > 0) [items[i - 1], items[i]] = [items[i], items[i - 1]];
      if (a === "dn" && i < items.length - 1) [items[i + 1], items[i]] = [items[i], items[i + 1]];
      draw();
    };
    draw();
  }

  /* ---------------- deal button ---------------- */
  function tabDeal() {
    const d = clone(S.deal), phones = (S.contact.phones || []);
    $("#main").innerHTML = `<h2>دکمه معامله</h2><p class="sub">وقتی مشتری روی «معامله» می‌زند چه اتفاقی بیفتد؟ (برای هر ملک می‌توانید جداگانه هم تعیین کنید.)</p>
      <div class="card"><div class="f"><label>رفتار پیش‌فرض</label><div class="opts">
        ${[["call", "تماس مستقیم", "گوشی مشتری شماره را می‌گیرد"], ["chat", "پیام در پیام‌رسان (پیوی)", "گفتگو با متن آماده‌ی همان ملک باز می‌شود"], ["both", "مشتری انتخاب کند", "یک پنجره کوچک با دو گزینه تماس و پیام"]].map(([v, n, h]) => `<label class="opt"><input type="radio" name="mode" value="${v}" ${d.mode === v ? "checked" : ""}><span><b>${n}</b><small>${h}</small></span></label>`).join("")}</div></div>
      <div class="g2"><div class="f"><label>پیام‌رسان برای پیوی</label><select id="dCh">${Object.entries(CHANNELS).map(([k, n]) => `<option value="${k}" ${d.chat_channel === k ? "selected" : ""}>${n}</option>`).join("")}</select>
        <div class="hint">شناسه‌ها را در تب «تماس با ما» وارد کنید. برای روبیکا و ایتا متن ملک کپی می‌شود تا مشتری در گفتگو بچسباند.</div></div>
      <div class="f"><label>شماره‌ای که تماس می‌گیرد</label><select id="dPh">${phones.map((p, i) => `<option value="${i}" ${+d.call_phone_index === i ? "selected" : ""}>${esc(p.label || "تلفن")} — ${esc(p.number)}</option>`).join("") || "<option value='0'>ابتدا شماره ثبت کنید</option>"}</select></div></div>
      <div class="f" id="cuW"><label>لینک دلخواه (برای «لینک دلخواه»؛ می‌تواند شامل {text} و {title} باشد)</label><input id="dCu" dir="ltr" value="${esc(d.custom_url || "")}" placeholder="https://..."></div>
      <div class="g2"><div class="f"><label>نوشته دکمه</label><input id="dBt" value="${esc(d.button_text || "معامله")}"></div></div>
      <div class="f"><label>متن آماده پیام (می‌توانید از {title}، {code}، {price}، {location} استفاده کنید)</label><textarea id="dMt">${esc(d.message_template || "")}</textarea></div>
      <button class="btn gold" id="save">ذخیره</button></div>`;
    $("#save").onclick = () => saveSetting("deal", { mode: document.querySelector("input[name=mode]:checked").value, chat_channel: $("#dCh").value, call_phone_index: +$("#dPh").value || 0, custom_url: $("#dCu").value.trim(), button_text: $("#dBt").value.trim() || "معامله", message_template: $("#dMt").value });
  }

  /* ---------------- hero text ---------------- */
  function tabHero() {
    const chs = clone(S.hero.chapters);
    $("#main").innerHTML = `<h2>متن‌های روی ویدیو</h2><p class="sub">با اسکرول کاربر، این متن‌ها یکی‌یکی روی ویدیو ظاهر می‌شوند. اولی عنوان اصلی است. می‌توانید تعداد و ترتیب را تغییر دهید. برای آخرین متن می‌توانید دکمه بگذارید.</p>
      <div class="card"><div id="rep"></div><button class="btn gold" id="save" style="margin-top:8px">ذخیره</button></div>`;
    repeater($("#rep"), chs, [{ k: "title", label: "عنوان" }, { k: "text", label: "توضیح کوتاه", area: true }, { k: "cta_text", label: "نوشته دکمه (اختیاری)" }, { k: "cta_link", label: "لینک دکمه", ltr: true, ph: "#listings" }], { label: "متن", move: true, stack: true });
    $("#save").onclick = () => { if (!chs.length) return toast("حداقل یک متن لازم است", true); saveSetting("hero", { chapters: chs }); };
  }

  /* ---------------- about ---------------- */
  function tabAbout() {
    const a = clone(S.about); a.stats = a.stats || [];
    $("#main").innerHTML = `<h2>درباره ما</h2><p class="sub">متنی که در بخش «درباره ما» سایت نمایش داده می‌شود. هر خط جدید یک پاراگراف می‌شود.</p>
      <div class="card"><div class="f"><label>عنوان</label><input id="aT" value="${esc(a.title || "")}"></div>
      <div class="f"><label>متن</label><textarea id="aB" style="min-height:190px">${esc(a.body || "")}</textarea></div>
      <div class="f"><label>آمار (اختیاری، مثل «۱۰+ سال تجربه»)</label><div id="rep"></div></div>
      <div class="f"><label>عکس کنار متن (اختیاری؛ اگر خالی باشد لوگو نمایش داده می‌شود)</label><div id="aImg"></div>
      <label class="btn sm" style="cursor:pointer">انتخاب عکس<input id="aF" type="file" accept="image/*" hidden></label> <button class="btn sm bad" id="aRm">حذف عکس</button> <span class="hint" id="up"></span></div>
      <button class="btn gold" id="save">ذخیره</button></div>`;
    repeater($("#rep"), a.stats, [{ k: "value", label: "عدد" }, { k: "label", label: "عنوان" }], { label: "آمار" });
    const draw = () => $("#aImg").innerHTML = a.image_url ? `<img src="${esc(a.image_url)}" style="max-width:240px;border-radius:6px;margin-bottom:8px" alt="">` : "";
    draw();
    $("#aF").onchange = async e => { const f = e.target.files[0]; if (!f) return; $("#up").textContent = "در حال آپلود…"; try { a.image_url = await uploadImage(f, "site"); draw(); } catch (er) { toast("آپلود ناموفق: " + er.message, true); } $("#up").textContent = ""; };
    $("#aRm").onclick = () => { a.image_url = ""; draw(); };
    $("#save").onclick = () => saveSetting("about", { title: $("#aT").value.trim(), body: $("#aB").value, stats: a.stats.filter(s => s.value || s.label), image_url: a.image_url || "" });
  }

  /* ---------------- contact ---------------- */
  function tabContact() {
    const c = clone(S.contact); c.phones = c.phones || [];
    const F = (id, label, k, ph, ltr) => `<div class="f"><label>${label}</label><input id="${id}" value="${esc(c[k] || "")}" ${ltr ? 'dir="ltr"' : ""} placeholder="${esc(ph || "")}"></div>`;
    $("#main").innerHTML = `<h2>تماس با ما</h2><p class="sub">شماره‌ها روی گوشی با یک لمس تماس می‌گیرند.</p>
      <div class="card"><div class="f"><label>شماره‌های تماس</label><div id="rep"></div></div>
      <div class="g2">${F("cA", "آدرس", "address")}${F("cH", "ساعت کاری", "hours")}</div>
      ${F("cM", "لینک نقشه (نشان / بلد / گوگل‌مپ)", "map_url", "https://...", 1)}
      <div class="g2">${F("cTg", "تلگرام (نام کاربری)", "telegram", "username", 1)}${F("cWa", "واتساپ (شماره)", "whatsapp", "09120000000", 1)}${F("cRu", "روبیکا (شناسه)", "rubika", "username", 1)}${F("cEi", "ایتا (شناسه)", "eitaa", "username", 1)}${F("cIg", "اینستاگرام", "instagram", "username", 1)}${F("cEm", "ایمیل", "email", "", 1)}</div>
      <button class="btn gold" id="save">ذخیره</button></div>`;
    repeater($("#rep"), c.phones, [{ k: "label", label: "عنوان", ph: "دفتر مرکزی" }, { k: "number", label: "شماره", ltr: true, ph: "09120000000" }], { label: "شماره" });
    $("#save").onclick = () => saveSetting("contact", { phones: c.phones.filter(p => p.number), address: $("#cA").value.trim(), hours: $("#cH").value.trim(), map_url: $("#cM").value.trim(), telegram: $("#cTg").value.trim(), whatsapp: $("#cWa").value.trim(), rubika: $("#cRu").value.trim(), eitaa: $("#cEi").value.trim(), instagram: $("#cIg").value.trim(), email: $("#cEm").value.trim() });
  }

  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  boot();
})();

</script>
</body>
</html>
